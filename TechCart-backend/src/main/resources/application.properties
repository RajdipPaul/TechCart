spring.application.name=TechCart-Backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/techcart_db
spring.datasource.username=root
spring.datasource.password=

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
paypal.inr-per-usd=93.93

paypal.base-url=https://api-m.sandbox.paypal.com
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}


paypal.return-url=${PAYPAL_RETURN_URL:http://localhost:5173/payment/success}
paypal.cancel-url=${PAYPAL_CANCEL_URL:http://localhost:5173/payment/cancel}

gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}